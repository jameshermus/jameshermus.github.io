# -----------------------------------------------------------------------------
# Conference & submission deadlines  ->  rendered at /deadlines/
# -----------------------------------------------------------------------------
#
# TO ADD AN ENTRY: copy the block below, fill it in, commit. Nothing else to edit.
# Topic chips on the page are generated automatically from the `tags` you use.
#
#   - name: ICRA 2027                  # short name shown in bold (include the year
#                                      #   ONLY if that edition is confirmed)
#     full_name: ...                   # spelled-out name (optional)
#     deadline: "2026-09-15T23:59:00-07:00"   # MUST be quoted, MUST be full ISO 8601
#                                      #   with a UTC offset. Leave out entirely if
#                                      #   the date has not been announced.
#                                      #   AoE (anywhere on earth) = -12:00
#                                      #   US Pacific = -08:00 winter / -07:00 summer
#                                      #   Central Europe = +01:00 winter / +02:00 summer
#     deadline_label: Paper submission # what the deadline is for (default: "Submission")
#     status: confirmed                # confirmed | expected | tba
#                                      #   confirmed = taken from the official site
#                                      #   expected  = my guess from past years, shown with ~
#                                      #   tba       = not announced (use with `hint`)
#     hint: typically late September   # shown instead of a countdown when status is tba
#     extra:                           # optional secondary deadlines, listed under the main one
#       - label: Abstract registration
#         date: "2026-09-11T23:59:00-12:00"
#     notification: "2027-01-31"       # optional, display only
#     dates: May 24–28, 2027           # when the meeting happens
#     place: Seoul, South Korea
#     url: https://2027.ieee-icra.org/
#     tags: [robotics, manipulation]
#     note: optional one-line remark
#
# Past entries are hidden by default (toggle on the page) — no need to delete them.
# -----------------------------------------------------------------------------


