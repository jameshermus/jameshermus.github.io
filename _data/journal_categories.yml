# -----------------------------------------------------------------------------
# Category order and blurbs for /journals/
# -----------------------------------------------------------------------------
# The order here is the order on the page: 1-4 are the core of the stated scope,
# 5-7 the robotics and translational neighbours, 8-11 supporting infrastructure.
# `key` must match the `category:` field in _data/journals.yml.
# `hidden: true` keeps a group out of the default view (shown under "show everything").
# -----------------------------------------------------------------------------

- key: behavioural-motor-control
  title: Behavioural motor control findings
  what: A controlled human experiment, or a model of one, with a result that matters to people who study movement.

- key: broad-interest
  title: Broad-interest findings
  what: A result meant for readers beyond the field — or sound work that simply needs a broad, general home.

- key: robotics-methods
  title: "Robotics: methods & control"
  what: An algorithm, controller, or manipulation method with thorough experimental characterisation.

- key: robotics-flagship
  title: "Robotics: systems & flagship"
  what: A system that does something previously impossible, deployed and benchmarked.

- key: overflow
  title: Also on file
  what: Everything else on file — relevant venues that did not make a shortlist above, plus a few kept for reference.
  hidden: true

- key: earlier-work
  title: Earlier work
  what: Journals from earlier CT imaging work. Kept for the record, not a recommendation.
  hidden: true
