# -----------------------------------------------------------------------------
# Journals with rolling submission  ->  rendered at /journals/
# -----------------------------------------------------------------------------
#
# Special issues DO have deadlines — put those in _data/conferences.yml instead.
#
#   - name: IEEE Transactions on Robotics (T-RO)
#     url: https://...
#     jif: 11.1              # Clarivate Journal Impact Factor. Omit if not indexed.
#     jif_year: 2025         # which JCR release the number is from
#     jif_note: not assigned # shown instead of a number when there is no JIF
#     pubs: 2                # how many of my papers appeared here. Omit for zero.
#                            #   Journals with pubs > 0 are listed first, ordered
#                            #   by this count. Counts come from _bibliography/papers.bib
#                            #   — update them when you add a paper.
#     tags: [robotics]
#     note: one-line remark (scope, turnaround, conference tie-in)
#
# JIF values below are from the JCR 2025 release (published June 2026) via
# ooir.org, except where jif_year says otherwise. Refresh them each summer.
# -----------------------------------------------------------------------------

# ---------------------------------------------------------------- robotics ---

- name: Science Robotics
  url: https://www.science.org/journal/scirobotics
  jif: 25.5
  jif_year: 2025
  tags: [robotics]
  note: Rolling; presubmission inquiry recommended.

- name: IEEE Transactions on Robotics (T-RO)
