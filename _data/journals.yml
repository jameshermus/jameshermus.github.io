# -----------------------------------------------------------------------------
# Venue guide  ->  rendered at /journals/
# -----------------------------------------------------------------------------
#
# This is a CURATED GUIDE, not a publication record. The question it answers is
# "I have this kind of result — where does it go?"  Entries are grouped by KIND
# OF RESULT, not by field.
#
# Keep each category a curated short list. If one grows long enough to stop
# being a short list, that is a sign the category is too broad — split it.
#
#   - name: IEEE Transactions on Robotics (T-RO)
#     url: https://...
#     category: robotics-methods   # REQUIRED. Must match a key in _data/journal_categories.yml
#                                  #   Use `overflow` to keep an entry off the default
#                                  #   view (still reachable via "show everything"),
#                                  #   or `earlier-work` for biography, not recommendation.
#     submission: rolling          # rolling | proposal | invited
#     jif: 11.1                    # Clarivate JIF. Omit if the journal is not in JCR.
#     jif_year: 2025               # which JCR release the number came from
#     jif_note: not assigned       # only for a FACT about the journal (e.g. eLife has no JIF)
#     jif_status: unverified       # only for a fact about OUR DATA (number not checked yet)
#     pubs: 1                      # how many of my papers are here. Badge only — never a sort key.
#     tags: [robotics]             # free-form, drives the filter chips
#     note: one-line remark
#
# Fields the page will render if present but which are deliberately NOT filled
# in yet, because they cannot be verified reliably at this scale and stale data
# is worse than none: apc, preprint, presub, decision_time.
#
# JIF values are from the JCR 2025 release (published June 2026) via ooir.org
# unless jif_year says otherwise. Refresh each summer.
# -----------------------------------------------------------------------------

# === 1. Behavioural motor control findings ===================================

- name: Journal of Neurophysiology
  url: https://journals.physiology.org/journal/jn
  category: behavioural-motor-control
  submission: rolling
  jif: 2.3
  jif_year: 2025
  pubs: 2
  tags: [motor-control, neuroscience]
  note: The default home for human motor control experiments. Low JIF, high standing.

- name: Journal of Neuroscience
  url: https://www.jneurosci.org/
  category: behavioural-motor-control
  submission: rolling
  jif: 4.3
  jif_year: 2025
  tags: [neuroscience, motor-control]
  note: Broader neuroscience audience; expects a mechanistic claim.

- name: PLOS Computational Biology
  url: https://journals.plos.org/ploscompbiol/
  category: behavioural-motor-control
  submission: rolling
  jif: 3.6
  jif_year: 2024
  jif_status: 2025 value not published by our source
  tags: [neuroscience, motor-control]
  note: Models and simulation-based evidence; strong motor control readership.

- name: Biological Cybernetics
  url: https://link.springer.com/journal/422
  category: behavioural-motor-control
  submission: rolling
  jif: 2.0
  jif_year: 2025
  tags: [motor-control, control]
  note: Theory and models of biological and artificial control systems.

